name: OmniService CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

  test:
    name: Automated Unit & Security Test Suites
    runs-on: ubuntu-latest
    needs: validate
    env:
      NODE_ENV: test
      AUTH_SECRET: "981d48acf799ab420d79178ad438ae9caf5fd060a3785f72e6b569ad2f758044"
      MONGODB_URI: "mongodb://localhost:27017/test_omniservice"
      AI_PROVIDER: "mock"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Vitest test suites
        run: npm test

  build:
    name: Next.js Production Build Validation
    runs-on: ubuntu-latest
    needs: test
    env:
      NODE_ENV: production
      AUTH_SECRET: "981d48acf799ab420d79178ad438ae9caf5fd060a3785f72e6b569ad2f758044"
      MONGODB_URI: "mongodb+srv://mock:mock@mock.mongodb.net/omniservice"
      AI_PROVIDER: "gemini"
      NEXT_PUBLIC_APP_URL: "https://omniservice.volcanic.world"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Next.js build
        run: npx next build
